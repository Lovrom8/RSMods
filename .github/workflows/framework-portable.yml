# The mod framework has to keep building without MSVC or Windows, for hosts other than the DLL.
# AppVeyor covers MSVC; this covers the rest.
name: Framework (portable)

on:
  push:
    branches: [develop, avalonia-consolidated]
    paths:
      - DLL/Framework/**
      - DLL/Log.hpp
      - DLL/Lib/Json/**
      - '**/mods.manifest.json'
      - DLL/Mods/Metronome*
      - .github/workflows/framework-portable.yml
  pull_request:
    paths:
      - DLL/Framework/**
      - DLL/Log.hpp
      - DLL/Lib/Json/**
      - '**/mods.manifest.json'
      - DLL/Mods/Metronome*
      - .github/workflows/framework-portable.yml

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            cxx: g++
          - os: macos-15
            cxx: clang++
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # .gitignore keeps a host's manifest out, unless it's force-added. A second copy would drift from the Windows one.
      - name: Only the root manifest is tracked
        run: test "$(git ls-files -- ':(glob)**/mods.manifest.json')" = mods.manifest.json
      - name: Build and run the framework tests
        env:
          CXX: ${{ matrix.cxx }}
        run: sh DLL/Framework/Tests/BuildAndRun.sh
